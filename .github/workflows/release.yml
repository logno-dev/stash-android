name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Derive Android version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a stable vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          if (( ${#major} > 3 || ${#minor} > 2 || ${#patch} > 2 )); then
            echo 'Version components exceed the supported ranges.' >&2
            exit 1
          fi
          code=$((major * 10000 + minor * 100 + patch))
          if (( code < 1 )); then exit 1; fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Test and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/stash-release.jks"
      - name: Build signed APK
        env:
          STASH_KEYSTORE_PATH: ${{ runner.temp }}/stash-release.jks
          STASH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STASH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STASH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
      - name: Verify and name APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/stash-$VERSION_NAME.apk"
          cd release
          sha256sum "stash-$VERSION_NAME.apk" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.apk release/SHA256SUMS --verify-tag --title "Stash $TAG" --generate-notes
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stash-release.jks"
